name:  deploy-dev

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build KMP Web Production Assets
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/kmp-wasm-app:dev-latest .
          docker push ghcr.io/${{ github.repository }}/kmp-wasm-app:dev-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.VPS_REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker pull ghcr.io/${{ github.repository }}/kmp-wasm-app:dev-latest
            docker stop kmp-web || true
            docker rm kmp-web || true
            docker stop kmp-web-app || true
            docker rm kmp-web-app || true
            docker stop kmp-web-app-dev || true
            docker rm kmp-web-app-dev || true
            docker stop kmp-wasm-app-dev || true
            docker rm kmp-wasm-app-dev || true
            
            docker run -d -p 80:80 --name kmp-wasm-app-dev --restart unless-stopped ghcr.io/${{ github.repository }}/kmp-wasm-app:dev-latest